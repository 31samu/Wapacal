name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Same-repository PR commits already receive push checks. Forks need PR checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: macOS ${{ matrix.macos }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - macos: 26
            runner: macos-26
            xcode: '26.6'
          # GitHub's macOS 27 image currently uses the xcode-27 preview label.
          - macos: 27
            runner: xcode-27
            xcode: '27.0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      # Keep Swift tools consistent instead of following the runner's default Xcode.
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          package-manager-cache: false

      - name: Show Swift tools
        run: |
          sw_vers
          xcrun --show-sdk-version
          xcrun swift --version
          xcrun swift-format --version

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build empty app
        run: npm run build:native

      - name: Run all tests
        run: npm run test:all
